<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aclonica&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Amiri+Quran&display=swap" rel="stylesheet">
</head>
<style>
    body{
        margin: 0;
        padding: 0;
        background: #232526;  /* fallback for old browsers */
        background: -webkit-linear-gradient(to right, #414345, #232526);  /* Chrome 10-25, Safari 5.1-6 */
        background: linear-gradient(to right, #414345, #232526); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
        font-family: 'Almendra', serif;
    }

    #div1,#div2{
        border: 2px solid black;
        margin: 100px;
        width: 25%;
        height: 150px;
        margin-left: 500px;
    }

    #div1{
        transition: transform 0.3s ease;
    }

    #div1:hover{
        transform: scale(1.05); 
        transform-origin: center; 
    }

    #div2 {
        border: 2px solid black;
        margin: 20px auto;
        width: 25%;
        max-height: 150px;            
        overflow-y: auto;  
        margin-left: 500px; 
        overflow-y: scroll;
        -ms-overflow-style: none;
        scrollbar-width: none;
    } 

    #div2::-webkit-scrollbar {
    display: none;
  }

    #div2 {
        max-height: calc(100vh - 200px);  
        overflow-y: auto;
        transition: transform 0.3s ease;
    }

    #Entertask{
        margin-left: 50px;
    }

    #div1>nav{
        background-color: black;
        margin-bottom: 30px;
        width: 100%;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items:center;
        color: beige;
        overflow: hidden;
    }

    #div2>nav{
        position: sticky;
        background-color: black;
        margin-bottom: 10px;
        width: 100%;
        height: 50px;
        display: flex;
        justify-content: center;
        align-items:center;
        color: beige;
        overflow: hidden;
    }

    #div2:hover{
        transform: scale(1.05); 
        transform-origin: center; 

    }

    #main{
        background-color: black;
        color: aliceblue;
        height: 50px;
        font-size: larger;
        width: 100%;
        margin: 0px;
        padding: 0px;
        display: flex;
        justify-content: center;
        align-items: center;
        
    }

    #Entertask:focus {
        outline: none;
        /* box-shadow: 0 0 5px rgba(81, 203, 238, 1);
        border: 2px solid rgba(81, 203, 238, 1); */
    }

    #sidebar {
        position: fixed;
        top: 50px;
        left: 0;
        width: 200px;
        height: 100%;
        background-color: #111;
        color: white;
        padding: 20px;
        box-sizing: border-box;
    }


/* Base styling for the dropdown button */
.dropdown .btn.btn-secondary.dropdown-toggle {
background-color: #4a90e2;
color: #ffffff;
border: 1px solid #357ab8;
padding: 8px 16px;
font-size: 14px;
border-radius: 4px;
transition: background-color 0.2s, border-color 0.2s;
}

.dropdown .btn.btn-secondary.dropdown-toggle:hover,
.dropdown .btn.btn-secondary.dropdown-toggle:focus {
background-color: #357ab8;
border-color: #2a5a8c;
}

/* Dropdown menu container */
.dropdown .dropdown-menu {
background-color: #ffffff;
border: 1px solid #ddd;
border-radius: 4px;
min-width: 180px;
box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
padding: 0; /* reset default padding if needed */
}

/* Dropdown items */
.dropdown .dropdown-item {
color: #333333;
padding: 10px 16px;
font-size: 14px;
transition: background-color 0.2s, color 0.2s;
}

/* Hover / focus state for items */
.dropdown .dropdown-item:hover,
.dropdown .dropdown-item:focus {
background-color: #f1f1f1;
color: #222222;
}

/* Active / selected dropdown item */
.dropdown .dropdown-item.active {
background-color: #e0e0e0;
color: #111111;
}

/* Divider *if you have one*/
.dropdown .dropdown-divider {
margin: 4px 0;
border-top: 1px solid #e5e5e5;
}

</style>
<body>
    <nav id="main">TO DO LIST
    <aside id="sidebar">
    <div class="dropdown show">
        <a class="btn btn-secondary dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
        Dropdown link
        </a>

    <div class="dropdown-menu" aria-labelledby="dropdownMenuLink">
    <a class="dropdown-item" href="#">Action</a>
    <a class="dropdown-item" href="#">Another action</a>
    <a class="dropdown-item" href="#">Something else here</a>
  </div>
  </div>

    </aside>
    </nav>
    <div id="div1">
        <nav>Tasks to Do</nav>
        <input type="text" id="Entertask" placeholder="Enter the task" style="border: 4px solid black;border-radius: 10%;" >
        <button id="Addtask" onclick="add()" style="border: 4px solid black;border-radius: 10%;">submit</button>
    </div>
    <div id="div2">
        <nav>Completed Tasks</nav>
        <ul id="completedList">

        </ul>
    </div>
</body>

<script>
    const input = document.getElementById('Entertask');
    const addBtn = document.getElementById('Addtask');
    const completedUl = document.getElementById('completedList');

    addBtn.addEventListener('click', add);

    function add() {
      const task = input.value.trim();
      if (task === '') return; // skip empty input

      const li = document.createElement('li');
      li.textContent = task;
      completedUl.appendChild(li);

      input.value = '';
      input.focus();
    }

</script>
</html>
